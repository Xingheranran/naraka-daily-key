const DETAIL = DATA.detail || {};
const DAYS = DATA.days || [];

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function weekday(d){
  const w = ["日","一","二","三","四","五","六"];
  const t = new Date(d + "T00:00:00+08:00");
  return isNaN(t) ? "" : "周" + w[t.getDay()];
}

function verifyTag(v){
  if (v === true) return '<span class="tag ok">已验证</span>';
  if (v === false) return '<span class="tag bad">失效</span>';
  return '<span class="tag">未验证</span>';
}

function renderToday(){
  const cur = DATA.current || null;
  const box = document.getElementById("today");
  if (!cur || !(cur.pc || cur.mobile)){
    box.innerHTML = `
      <div class="date"><span>当前有效答案</span><span>暂无</span></div>
      <div class="warn">现在没有仍在有效期内的答案。官方推文发布日 D 的答案，有效期到 <b>D+1 日 18:00</b>；
      接口里的推文链接会晚一天更新，所以每天会自动收录前一天发布的那条。</div>`;
    return;
  }
  const rec = DETAIL[cur.date] || {};
  const pc = cur.pc || {}, mb = cur.mobile || {};
  const rpc = rec.pc || {}, rmb = rec.mobile || {};
  const src = rpc.source || rmb.source || "";
  const title = rpc.title || rmb.title || "";
  const vu = (cur.valid_until || "").replace("T", " ").slice(0, 16);
  const stamp = (rec.updated_at || "").slice(11,16);
  box.innerHTML = `
    <div class="date">
      <span>当前有效答案 · 来源推文 ${esc(cur.date)} ${weekday(cur.date)}</span>
      <span>${vu ? "有效至 " + esc(vu) : ""}</span></div>
    <div class="sides">
      <div class="side"><div class="k">端游</div>
        <div class="v ${pc.answer ? "" : "empty"}">${esc(pc.answer || "—")}</div>
        <div class="t">${verifyTag(pc.verified)}</div></div>
      <div class="side"><div class="k">手游</div>
        <div class="v ${mb.answer ? "" : "empty"}">${esc(mb.answer || "—")}</div>
        <div class="t">${verifyTag(mb.verified)}</div></div>
    </div>
    ${src ? `<div class="meta"><span>来源：<a href="${esc(src)}" target="_blank" rel="noopener">${esc(title || "官方推文")}</a></span>${
      stamp ? `<span>抓取于 ${esc(stamp)}（北京时间）</span>` : ""}</div>` : ""}
  `;
}

function renderList(filter){
  const box = document.getElementById("list");
  const rows = DAYS.filter(d => !filter || d.date.includes(filter));
  if (!rows.length){
    box.innerHTML = `<div class="empty-tip">${DAYS.length ? "没有匹配的日期" : "还没有历史记录，抓取会在每天自动运行"}</div>`;
    return;
  }
  box.innerHTML = rows.slice(0, 120).map(d => {
    const rec = DETAIL[d.date] || {};
    const ocr = []
      .concat((rec.pc && rec.pc.ocr) || [], (rec.mobile && rec.mobile.ocr) || []);
    const detail = ocr.length
      ? `<div class="ocr" data-date="${esc(d.date)}">OCR 原文：${[...new Set(ocr)].map(t => `<code>${esc(t)}</code>`).join("")}</div>`
      : "";
    const tag = d.verified === true ? '<span class="tag ok">已验证</span>'
              : d.verified === false ? '<span class="tag bad">失效</span>' : '';
    return `<div class="row" data-date="${esc(d.date)}">
      <span class="d">${esc(d.date)} <span style="opacity:.7">${weekday(d.date)}</span></span>
      <span class="a ${d.pc ? "" : "empty"}">${esc(d.pc || "—")}</span>
      <span class="a ${d.mobile ? "" : "empty"}">${esc(d.mobile || "—")}${tag}</span>
    </div>${detail}`;
  }).join("");
}

document.getElementById("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  const el = document.querySelector(`.ocr[data-date="${row.dataset.date}"]`);
  if (el) el.classList.toggle("show");
});

document.getElementById("q").addEventListener("input", e => renderList(e.target.value.trim()));

renderToday();
renderList("");
</script>
